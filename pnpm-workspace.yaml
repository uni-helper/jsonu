ignoreWorkspaceRootCheck: true
catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true

catalog:

catalogs:
  cli:
    '@antfu/eslint-config': ^10.0.0
    bumpp: ^12.3.0
    eslint: ^10.14.0
    publint: ^0.3.25
    skills-npm: ^4.1.0
    tsdown: ^0.23.7
    typescript: ^6.0.3
    vite: ^8.3.6
  json:
    '@humanwhocodes/momoa': ^3.3.13
  testing:
    tsdown-stale-guard: ^0.1.3
    vitest: ^5.1.0
  types:
    '@types/node': ^26.6.6
